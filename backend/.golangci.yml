version: "2"

run:
  timeout: 5m
  # Keep in sync with the `go` directive in go.mod.
  go: "1.25.0"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax

formatters:
  enable:
    - gofmt
